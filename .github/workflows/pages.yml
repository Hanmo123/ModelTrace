name: Deploy ModelTrace web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    if: vars.GH_PAGES_ENABLED != 'false'
    uses: ./.github/workflows/build-web.yml
    with:
      base-url: ${{ vars.GH_PAGES_BASE_URL || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
      proxy-url: ${{ vars.GH_PAGES_PROXY_URL || '' }}
      artifact-name: modeltrace-github-pages

  deploy:
    needs: build-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: modeltrace-github-pages
          path: site
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
